
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhark Key Auction</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #09090f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 8%;
      border-bottom: 1px solid #29203d;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      color: #a855f7;
      font-size: 22px;
      font-weight: bold;
    }

    button {
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      background: #7c3aed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    main {
      max-width: 1000px;
      margin: 65px auto;
      padding: 20px;
      text-align: center;
    }

    h1 { font-size: 42px; }
    h1 span { color: #a855f7; }
    .subtitle { color: #aaa; }

    .panel {
      background: #15121f;
      border: 1px solid #38234f;
      border-radius: 14px;
      padding: 25px;
      margin-top: 35px;
    }

    .discord {
      background: #5865f2;
      margin-top: 15px;
    }

    .notice {
      color: #aaa;
      font-size: 13px;
    }

    #account {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    #account img {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    @media (max-width: 600px) {
      h1 { font-size: 30px; }
      header { padding: 18px 5%; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">ZHARK AUCTION</div>
    <div id="account">
      <button id="loginButton">Entrar com Discord</button>
    </div>
  </header>

  <main>
    <h1>LEILÕES DE <span>KEYS</span></h1>
    <p class="subtitle">Dispute. Ofereça. Conquiste.</p>

    <section class="panel">
      <h2 id="welcome">Bem-vindo ao Zhark Key Auction</h2>
      <p id="message">
        Entre com sua conta Discord para participar dos leilões.
      </p>
      <button class="discord" id="mainLogin">
        Autorizar conta Discord
      </button>
      <p class="notice">Sua conta será autenticada com segurança.</p>
    </section>

    <section class="panel">
      <h2>Leilões disponíveis</h2>
      <p class="subtitle">Em breve, os leilões aparecerão aqui.</p>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL =
      "https://agzxdptfeszbridmwbbx.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_XhwL0fL0eKLM2cJUfaTMeg_V9noduzf";

    const supabase = createClient(
      SUPABASE_URL,
      SUPABASE_KEY,
      {
        auth: {
          flowType: "pkce",
          autoRefreshToken: true,
          persistSession: true,
          detectSessionInUrl: true
        }
      }
    );

    const loginButton = document.getElementById("loginButton");
    const mainLogin = document.getElementById("mainLogin");
    const account = document.getElementById("account");

    async function loginDiscord() {
      loginButton.disabled = true;
      mainLogin.disabled = true;

      const { error } = await supabase.auth.signInWithOAuth({
        provider: "discord",
        options: {
          redirectTo:
            "https://thaylorliberato2025-boop.github.io/Zhark-Key-Auction/"
        }
      });

      if (error) {
        alert("Erro no login: " + error.message);
        loginButton.disabled = false;
        mainLogin.disabled = false;
      }
    }

    function showUser(user) {
      if (!user) return;

      const metadata = user.user_metadata || {};

      const name =
        metadata.full_name ||
        metadata.global_name ||
        metadata.name ||
        metadata.user_name ||
        metadata.preferred_username ||
        "Usuário Discord";

      const avatar =
        metadata.avatar_url ||
        metadata.picture ||
        "";

      document.getElementById("welcome").textContent =
        "Bem-vindo, " + name + "!";

      document.getElementById("message").textContent =
        "Você está conectado com sua conta Discord.";

      account.replaceChildren();

      if (avatar) {
        const img = document.createElement("img");
        img.src = avatar;
        img.alt = "Foto de perfil";
        account.appendChild(img);
      }

      const nameText = document.createElement("span");
      nameText.textContent = name;
      account.appendChild(nameText);

      const status = document.createElement("span");
      status.textContent = "● Conectado";
      status.style.color = "#b8ffb8";
      account.appendChild(status);

      mainLogin.textContent = "Conta autorizada";
      mainLogin.disabled = true;
    }

    loginButton.addEventListener("click", loginDiscord);
    mainLogin.addEventListener("click", loginDiscord);

    supabase.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        showUser(session.user);
      }
    });

    const { data, error } = await supabase.auth.getSession();

    if (error) {
      console.error("Erro ao recuperar sessão:", error.message);
    } else if (data.session?.user) {
      showUser(data.session.user);
    }
  </script>
</body>
</html>
